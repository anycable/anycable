name: Publish binaries
permissions:
  actions: write
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: true
        default: true
        type: boolean

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Prepare release
        id: release
        env:
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          DISPATCH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PRERELEASE: ${{ github.event.release.prerelease }}
          PUBLISHED_RELEASE_ID: ${{ github.event.release.id }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Releases must be dispatched from main (received $GITHUB_REF)" >&2
              exit 1
            fi

            version="$DISPATCH_VERSION"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $version" >&2
              exit 1
            fi

            tag="v$version"
            prerelease="$DISPATCH_PRERELEASE"

            if release_id=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft --jq 'select(.isDraft) | .databaseId'); then
              if [[ -z "$release_id" ]]; then
                echo "Release $tag already exists and is not a draft" >&2
                exit 1
              fi
              echo "Reusing draft release $tag"
            else
              args=("$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --title "$tag")
              if [[ "$prerelease" == "true" ]]; then
                args+=(--prerelease)
              fi
              gh release create "${args[@]}"
              release_id=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
            fi
          else
            tag="$PUBLISHED_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi

            version="${tag#v}"
            prerelease="$PUBLISHED_PRERELEASE"
            release_id="$PUBLISHED_RELEASE_ID"
          fi

          {
            echo "prerelease=$prerelease"
            echo "release_id=$release_id"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  upload_binaries:
    needs: [prepare_release]
    runs-on: ubuntu-22.04
    env:
      GO111MODULE: on
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=vendor"
      ANYCABLE_TELEMETRY_TOKEN: ${{ secrets.ANYCABLE_TELEMETRY_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare_release.outputs.tag }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install bison
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: vendor-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            vendor-
      - run: go mod vendor
      - uses: ruby/setup-ruby@v1
        with:
          # Use <3.0 since go-mruby's Rakefile has some problems with keyword arguments compatibility
          ruby-version: 2.7
          bundler-cache: true
      - name: Build mruby
        run: bash -c '(cd vendor/github.com/mitchellh/go-mruby && MRUBY_CONFIG=../../../../../../etc/build_config.rb make libmruby.a)'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          env GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X github.com/anycable/anycable-go/telemetry.auth=$(echo "$ANYCABLE_TELEMETRY_TOKEN") -X github.com/anycable/anycable-go/version.version=${{ needs.prepare_release.outputs.version }} -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o dist/anycable-go-win-amd64.exe cmd/anycable-go/main.go
          env GOOS=freebsd GOARCH=arm   go build -ldflags "-s -w -X github.com/anycable/anycable-go/telemetry.auth=$(echo "$ANYCABLE_TELEMETRY_TOKEN") -X github.com/anycable/anycable-go/version.version=${{ needs.prepare_release.outputs.version }} -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o dist/anycable-go-freebsd-arm cmd/anycable-go/main.go
          env GOOS=freebsd GOARCH=amd64 go build -ldflags "-s -w -X github.com/anycable/anycable-go/telemetry.auth=$(echo "$ANYCABLE_TELEMETRY_TOKEN") -X github.com/anycable/anycable-go/version.version=${{ needs.prepare_release.outputs.version }} -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o dist/anycable-go-freebsd-amd64 cmd/anycable-go/main.go
          env GOOS=linux GOARCH=arm64   go build -ldflags "-s -w -X github.com/anycable/anycable-go/telemetry.auth=$(echo "$ANYCABLE_TELEMETRY_TOKEN") -X github.com/anycable/anycable-go/version.version=${{ needs.prepare_release.outputs.version }} -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o dist/anycable-go-linux-arm64 cmd/anycable-go/main.go
          env GOOS=linux GOARCH=amd64   go build -ldflags "-s -w -X github.com/anycable/anycable-go/telemetry.auth=$(echo "$ANYCABLE_TELEMETRY_TOKEN") -X github.com/anycable/anycable-go/version.version=${{ needs.prepare_release.outputs.version }} -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o dist/anycable-go-linux-amd64 cmd/anycable-go/main.go
          dist/anycable-go-linux-amd64 -v
      - name: Build binary with MRuby
        env:
          CGO_ENABLED: "1"
        run: |
          env GOOS=linux GOARCH=amd64 go build -tags mrb -ldflags "-s -w -X github.com/anycable/anycable-go/telemetry.auth=$(echo "$ANYCABLE_TELEMETRY_TOKEN") -X github.com/anycable/anycable-go/version.version=${{ needs.prepare_release.outputs.version }} -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o dist/anycable-go-mrb-linux-amd64 cmd/anycable-go/main.go
          dist/anycable-go-mrb-linux-amd64 -v
      - uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "dist/anycable-go-*"
          overwrite: true
          release_id: ${{ needs.prepare_release.outputs.release_id }}

  upload_macos_binaries:
    needs: [prepare_release, upload_binaries]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
        suffix:
          - arm64
        include:
          - os: macos-15-intel
            suffix: amd64
    env:
      GO111MODULE: on
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=vendor"
      ANYCABLE_TELEMETRY_TOKEN: ${{ secrets.ANYCABLE_TELEMETRY_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare_release.outputs.tag }}
      - name: Install system deps
        run: |
          brew install bison
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: vendor-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            vendor-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod vendor
      - uses: ruby/setup-ruby@v1
        with:
          # Use <3.0 since go-mruby's Rakefile has some problems with keyword arguments compatibility
          ruby-version: 2.7
          bundler-cache: true
      - name: Build mruby
        run: bash -c '(cd vendor/github.com/mitchellh/go-mruby && MRUBY_CONFIG=../../../../../../etc/build_config.rb make libmruby.a)'
      - name: Build binaries for MacOS
        run: |
          env GOOS=darwin GOARCH=${{ matrix.suffix }} go build -ldflags "-s -w -X github.com/anycable/anycable-go/telemetry.auth=$(echo "$ANYCABLE_TELEMETRY_TOKEN") -X github.com/anycable/anycable-go/version.version=${{ needs.prepare_release.outputs.version }} -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o dist/anycable-go-darwin-${{ matrix.suffix }} cmd/anycable-go/main.go
      - name: Build binaries with MRuby for MacOS
        env:
          CGO_ENABLED: "1"
        run: |
          env GOOS=darwin GOARCH=${{ matrix.suffix }} go build -tags mrb -ldflags "-s -w -X github.com/anycable/anycable-go/telemetry.auth=$(echo "$ANYCABLE_TELEMETRY_TOKEN") -X github.com/anycable/anycable-go/version.version=${{ needs.prepare_release.outputs.version }} -X github.com/anycable/anycable-go/version.sha=$(echo "$GITHUB_SHA" | cut -c -7)" -a -o dist/anycable-go-mrb-darwin-${{ matrix.suffix }} cmd/anycable-go/main.go
          dist/anycable-go-mrb-darwin-${{ matrix.suffix }} -v
      - uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "dist/anycable-go-*"
          overwrite: true
          release_id: ${{ needs.prepare_release.outputs.release_id }}

  publish_release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [prepare_release, upload_binaries, upload_macos_binaries]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare_release.outputs.prerelease }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease="$PRERELEASE"
          gh workflow run release-docker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version="$VERSION"
