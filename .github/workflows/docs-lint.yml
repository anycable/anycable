name: Lint Docs
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  docs-lint:
    uses: anycable/github-actions/.github/workflows/docs-lint.yml@master
    with:
      rubocop: false
      mdl-path: docs
      lychee-args: docs/* --exclude "(ruby|deployment|assets)/"
      forspell-args: "**/*.md *.md -e BACKERS.md -e ds/DESIGN.md"
