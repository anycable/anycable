name: Publish PRO source code
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  upload_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract Pro source code
        run: |
          make dist/anycable-source
      - name: Push to releases repo
        env:
          GH_TOKEN: ${{ secrets.SOURCE_RELEASES_ACCESS_TOKEN }}
        run: |
          gh repo clone https://github.com/anycable/anycable-pro-source-releases dist/anycable-pro-source-releases
          cd dist/anycable-pro-source-releases
          cp -r ../anycable-source/* .
          git config --global user.email "anycable@evilmartians.com"
          git config --global user.name "AnyCable Pro"
          gh auth setup-git
          git add -A
          git commit -m "Update pro source code (from ${{ github.sha }})"
          git push -f origin master
