name: Publish AnyCable+ Docker image
on:
  workflow_dispatch:
    inputs:
      tag:
        type: choice
        description: Pro image tag
        options:
          - edge
          - latest
        default: edge
  workflow_run:
    workflows:
      - Publish PRO Docker images

jobs:
  push_to_fly:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=vendor"
    steps:
      - uses: docker/setup-buildx-action@v2
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Authorize Fly Docker registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
      - name: Pull latest Pro image
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: |
          docker pull ghcr.io/anycable/anycable-go-pro:latest
      - name: Push latest Pro image to Fly
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        run: |
          docker image tag ghcr.io/anycable/anycable-go-pro:latest registry.fly.io/anycable-saaqs:anycable-go-pro-latest
          docker push registry.fly.io/anycable-saaqs:anycable-go-pro-latest
      - name: Pull edge Pro image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          docker pull ghcr.io/anycable/anycable-go-pro:${{ github.event.inputs.tag }}
      - name: Push Edge Pro image to Fly
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          docker image tag ghcr.io/anycable/anycable-go-pro:${{ github.event.inputs.tag }} registry.fly.io/anycable-saaqs:anycable-go-pro-edge
          docker push registry.fly.io/anycable-saaqs:anycable-go-pro-edge
